<div id="padl0">
    <div id="divContent" class="ContentBox" style="width: 900px; overflow: visible;">
        <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
            <!--header-->
            <tr>        
                <th>Month</th>
                <th>Total Active Member</th>
                <th>Qualified member</th>
                <th>Deposit</th>
                <th>Withdrawal</th>
                <th>Turnover</th>
                <th>Winlost</th>
                <th>Commission</th>
            </tr>            
            <!--/header-->
            <!--nodata-->
            <!--content-->
            <tr class="nowrap r" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                <td class="l">{month}</td>
                <td>{activeplayer}</td>
                <td>{qualified-member}</td>
                <td>{deposit}</td>
                <td>{withdrawal}</td>
                <td>{turnover}</td>
                <td>{winlost}</td>
                <td>{commission}</td>
            </tr>
            <!--/content-->
            <!--/nodata-->
        </table>
    </div>
</div>
