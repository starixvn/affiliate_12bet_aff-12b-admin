<div id="padl0">
    {submenu}
    <form id="frmSearch" name="frmSearch" method="get" style="margin: 7px 0;">
    <div id="search_cont">
        <table cellspacing="1" cellpadding="3" border="0">
            <tr>
                <td class="r">
                    {aff-txt}
                </td>
                <td>
                    <input type="text" name="affname" id="affname" size="13" value="{affname}" onfocus="Focus()" onblur="Blur()" class="txtdate-no-time" />
                </td>
                <td>
                    <select name="slSport" id="slSport">
                        <option value="1">Sportbook</option>
                        <option value="3">Casino</option>      
                    </select>
                </td>
                <td>
                    <select name="slPreferLang" id="slPreferLang">
                        <option value="">Select Language</option>
                        <option value="en-US">English</option>
                        <option value="en-GB">English_Euro</option>
                        <option value="zh-TW">Chinese Traditional</option>
                        <option value="zh-CN">Chinese Simplified</option>
                        <option value="th-TH">Thai</option>
                        <option value="es-ES">Spanish</option>    
                        <option value="vi-VN">Vietnamese</option>    
                        <option value="id-ID">Indonesian</option>
                        <option value="ko-KR">Korean</option>       
                        <option value="ja-JP">Japanese</option>     
                    </select> 
                </td>
                <td class="r">
                    {fdate-txt}
                </td>
                <td>
                    <input type="text" readonly name="fdate" size="13" value="{fdate}" class="txtdate-no-time"
                        id="fdate" />&nbsp;
                    <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand"
                        style="margin-bottom: -3px;" title="Date selector" id="fdateTrigger" />

                    <script type="text/javascript">
                        Calendar.setup({
                            inputField: "fdate",
                            ifFormat: "%m/%d/%Y",
                            button: "fdateTrigger",
                            singleClick: true,
                            showsTime: false,
                            showOthers : true,
                            step : 1
                        });
                    </script>

                </td>
                <td class="r">
                    {tdate-txt}
                </td>
                <td>
                    <input type="text" readonly name="tdate" size="13" value="{tdate}" class="txtdate-no-time"
                        id="tdate" />&nbsp;
                    <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand"
                        style="margin-bottom: -3px;" title="Date selector" id="tdateTrigger" />

                    <script type="text/javascript">
                        Calendar.setup({
                            inputField: "tdate",
                            ifFormat: "%m/%d/%Y",
                            button: "tdateTrigger",
                            singleClick: true,
                            showsTime: false,
                            showOthers : true,
                            step : 1
                        });
                    </script>
                </td>
                <td>
                    <select id="sortby" name="sortby">
                        <option value="">Sort by</option>
                        <option value="Member">Member</option>
                        <option value="Deposit">Deposit</option>
                        <option value="Turnover">Turnover</option>
                        <option value="Winlost">Winlost</option>
                        <option value="Commission">Commission</option>
                    </select>
                </td>
                <td style="width: 100px">
                    <span id="divsearch" onclick="Search();">&nbsp;</span>
                </td>
            </tr>
        </table>
    </div>
    <input type="hidden" id="page" name="page" value="{page}" />    
    <input type="submit" value="" class="hide" />  
    <input type="hidden" id="hdLanguage" name="hdLanguage" value="{lang-val}" />
    <input type="hidden" name="all" id="all" value="{all-val}"/>
    <div id="divContent" class="ContentBox" style="width: 960px; overflow: visible;">
        {paging-top}
        <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
            <!--header-->
            <tr>        
                <th>Affiliate</th>
                <th>Total Active Member</th>
                <th>Qualified member</th>
                <th>Deposit</th>
                <th>Withdrawal</th>
                <th>Turnover</th>
                <th>Winlost</th>
                <th>Commission</th>
                <th>History</th>
            </tr>            
            <!--/header-->
            <!--nodata-->
            <!--content-->
            <tr class="nowrap r" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                <td class="l">{affiliate-val}</td>
                <td>{activeplayer}</td>
                <td>{qualified-member}</td>
                <td>{deposit}</td>
                <td>{withdrawal}</td>
                <td>{turnover}</td>
                <td>{winlost}</td>
                <td>{commission}</td>
                <td class="c">
                    <a onclick="viewDetail({affiliateid},'{affiliate-val}', {sport-val});" href="javascript:;">View</a>
                </td>
            </tr>
            <!--/content-->
            <!--/nodata-->
        </table>
        {paging-bottom}
    </div>
    </form>
</div>
<script type="text/javascript" language="javascript">
    function viewDetail(affId, affiliate, sportId) {
        var fdate = document.getElementById('fdate').value;
        var tdate = document.getElementById('tdate').value;
        DoCal('PerformanceReportByAffiliate.aspx?affId=' + affId + '&fdate=' + fdate + '&tdate=' + tdate + '&sportid=' + sportId, 'Performance report by ' + affiliate, 960, 400);
    }
</script>
