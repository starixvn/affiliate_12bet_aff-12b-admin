<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Untitled Page</title>
    <style type="text/css">
        html, body
        {
            margin: 0px;
            padding: 0px;
        }
        #footer
        {
            background: transparent url(App_Themes/DefaultV2/images/bg_footer.jpg) repeat-x scroll center top;
            height: 18px;
            margin-top: 0;
            padding: 5px 15px;
            text-align: right;
            font-size: 11px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div id="footer">
        <script type="text/javascript">
            var now = new Date();
            document.write(" © Copyright " + now.getFullYear() + " Pacific Sea Invests");
        </script>
    </div>
    <% if (AppSettings.Environment.Equals("UAT", StringComparison.OrdinalIgnoreCase))
   { %>
    <!-- Piwik -->
    <script type="text/javascript">
        var _paq = _paq || [];
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function () {
            var u = "https://pw.detecas.com/";
            _paq.push(['setTrackerUrl', u + 'piwik.php']);
            _paq.push(['setSiteId', 27]);
            var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
            g.type = 'text/javascript'; g.async = true; g.defer = true; g.src = u + 'piwik.js'; s.parentNode.insertBefore(g, s);
        })();

    </script>
    <noscript>
        <p>
            <img src="https://pw.detecas.com/piwik.php?idsite=27" style="border: 0;" alt="" /></p>
    </noscript>
    <!-- End Piwik Code -->
    <% } %>
</body>
</html>
