<form id="frmData" method="get">
 <div id="search_cont" style="height: 25px;">
                <table class="aff-table" cellspacing="1" cellpadding="1">
                    <tr>
                        <td>{From}:</td>
                        <td class="r" style="width: 100px">
                            <input type="text" id="fdate" name="fdate" size="13" value="{fdate}"  />
                        </td>
                        <td>
                            <img hspace="3" height="20" border="0" width="18" src="../App_Themes/Default/Images/cal.gif"
                                id="fdateTrigger" />
                        </td>
                        <td>
                            {To}:
                        </td>
                        <td style="width: 100px" class="r">
                            <input type="text" id="tdate" name="tdate" size="13" value="{tdate}" />
                        </td>
                        <td>
                            <img hspace="3" height="20" border="0" width="18" src="../App_Themes/Default/Images/cal.gif"
                                id="tdateTrigger" />
                        </td>
                        <td >                            
                            {All}
                            <input type="checkbox" id="getall" name="getall" {getall} value="true" />                            
                        </td>
                        <td>
                            {Deposit}:
                        </td>
                        <td>
                            <select id="deposit" name="deposit">
                                {depositlist}
                            </select>
                        </td>
                        <td>
                            <input type="button" value="{Submit}" onclick="LoadData(1);" id="btnSubmit" name="{Submit}"
                                class="button" />
                        </td>
                    </tr>
                </table>
            </div>
{paging-top}
<div class="tbl-box">
<table class="aff-table" cellspacing="1" cellpadding="1" style="width: 800px">
    <tr class="tblheader">
        <td style="width:15px;">&nbsp;</td>
        <td style="width:100px;">{UserName}</td>
        <td style="width:100px;">{FName}</td>
        <td style="width:100px;">{LName}</td>
        <td style="width:100px;">{Email}</td>
        <td style="width:60px;">{MobileNumber}</td>
        <td>{RegisteredDate}</td>
        <td>{FirstDepositDate}</td>
    </tr>
    <!--content-->
    <tr class="{style}" onmouseover="this.className=c;" onmouseout="this.className={style1};">
        <td class="c">{no}</td>
        <td>{username-val}</td>
       <td>{fname-val}</td>
       <td>{lname-val}</td>
       <td>{email-val}</td>
       <td>{mobilenumber-val}</td>
       <td class="c">{registereddate-val}</td>
       <td class="c">{firstdepositdate-val}</td>
    </tr>
    <!--/content-->
</table>
</div>
{paging-bottom}
    <input type="hidden" id="page" name="page" value="{page}" />
</form>
