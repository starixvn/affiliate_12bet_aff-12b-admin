<div id="padl0">
    <form method="post" action="../Handler/UploadExcel.ashx" enctype="multipart/form-data"
    onsubmit="return IsValidFileExcel(document.getElementById('txtfile'));" target="upload_target"
    id="UploadExcel">
        <div class="clear">&nbsp;</div>
        <table class="aff-table l" cellspacing="1" cellpadding="3" border="0">
            <tr>
                <td colspan="2">
                    <div class="timelimit" id="timelimit">
                        You can only import Casino as below format:
                        <ul style="margin: 0px;">
                            <li>
                                File Extension is <b>"xlsx"</b>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    Upload Date
                </td>
                <td>
                    <input type="text" readonly name="fdate" size="13" value="{fdate}" class="txtdate-no-time"
                        id="fdate" />&nbsp;
                    <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand"
                        style="margin-bottom: -3px;" title="Date selector" id="fdateTrigger" />
                    <script type="text/javascript">
                        Calendar.setup({
                            inputField: "fdate",
                            ifFormat: "%m/%d/%Y",
                            button: "fdateTrigger",
                            singleClick: true,
                            showsTime: false,
                            showOthers: true,
                            step: 1
                        });
                    </script>
                    &nbsp;&nbsp; <input id="btnSearch" class="buttonlogin" name="btnSearch" type="button" value="Search"
                        onclick="searchCasino();" />
                </td>
            </tr>
            <tr>
                <td>
                    Excel File
                </td>
                <td>
                    <input id="txtfile" name="txtfile" size="40" type="file" onchange="return IsValidFileExcel(this);" />&nbsp;&nbsp;<input id="btnuploadbanner" class="buttonlogin" name="btnuploadbanner" type="button"
                        value="Upload" onclick="ExcelUpload();" />
                </td>
            </tr>
        </table>
        <input id="hdErrFileExtension" name="hdErrFileExtension" type="hidden" value="{ErrFileExtension}" />
    <br />
    <div id="errMsg" style="display: none; width: 370px;">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    <div id="divData">
        <!--hasdata-->
        <!--success-->
        <b class="{cssmsg}">{listtranstext}</b>
        <br />
        <!--success-->
        <table class="aff-table" cellspacing="1" cellpadding="2" id="tblResult" style="width: 400px;">
            <tr>
                <th>
                    &nbsp;
                </th>
                <th class="nowrap">
                    {date}
                </th>
                <th class="nowrap">
                    {username}
                </th>
                <th class="nowrap">
                    {currency}
                </th>
                <th class="nowrap">
                    {turnover}
                </th>
                <th class="nowrap">
                    {winlost}
                </th>
                <th class="nowrap">
                    {deposit}
                </th>
                <th class="nowrap">
                    {bonus}
                </th>
            </tr>
            <!--content-->
            <tr id="aff_{custid}" bgcolor="{color}" class="nowrap">
                <td class="c">
                    {no}
                </td>
                <td>
                    {date-val}
                </td>
                <td>
                    {username-val}
                </td>
                <td>
                    {currency-val}
                </td>
                <td class="r">
                    {turnover-val}
                </td>
                <td class="r">
                    {winlost-val}
                </td>
                <td class="r">
                    {deposit-val}
                </td>
                <td class="r">
                    {bonus-val}
                </td>
            </tr>
            <!--/content-->
        </table>
        <!--/hasdata-->
    </div>
    <input type="hidden" id="hdHasData" name="hdHasData" value="{hasdata}" />
    </form>
</div>
<iframe id="upload_target" name="upload_target" src="#" style="width: 0; height: 0;
    border: 0px solid #fff;"></iframe>
