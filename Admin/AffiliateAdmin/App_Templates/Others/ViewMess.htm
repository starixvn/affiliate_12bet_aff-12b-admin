<div class="padl0">
    <div id="errMsg" style="display: none; width: 264px; margin: 3px 0;">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>
    <div class="pcontent">
        <table cellspacing="5" cellpadding="0" width="100%">
          <tr>
            <td style="width: 120px;" class="r">
              {Important}
            </td>
            <td>
              <div class="chk ic-uncheck"/>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_EN}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageEn">{MessEn-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_CN}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageCn">{MessCn-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_TW}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageTw">{MessTw-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_TH}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageTh">{MessTh-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_ES}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageEs">{MessEs-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_VI}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageVi">{MessVi-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_ID}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageId">{MessId-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_KR}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageKr">{MessKr-val}</textarea>
            </td>
          </tr>
          <tr>
            <td class="r">
              {Message_JA}
            </td>
            <td>
              <textarea style="width: 418px; height: 64px;" id="txtMessageJp">{MessJa-val}</textarea>
            </td>
          </tr>
        </table>
    </div>
    <div class="l" style="margin-top:5px;">
      <input type="button" id="btnAdd" class="buttonlogin" value="{Add}" onclick="AddNewMessage()"/>
            <input type="button" id="btnEdit" class="buttonlogin" value="{Edit}" onclick="SetEditMode();" />
            <input type="button" id="btnUpdate" class="buttonlogin" style="display:none;" value="{Update}" onclick="UpdateMessage();" />
            &nbsp;
            <input type="button" id="btnDeleteCur" class="buttonlogin" value="{Delete}" onclick="DeleteCurrentMessage();" />
            &nbsp;
            <input type="button" id="btnClose" class="buttonlogin" value="{Cancel}" onclick="javascript:parent.ibcWnd.close();" />
      </div>
    <input id="mid" name="mid" type="hidden" value="{MsgID-val}" />
    <input id="hdImportant" name="hdImportant" type="hidden" value="{hdImportant-val}"/>
    <input id="hdMode" name="hdMode" type="hidden" value="{hdMode-val}"/>
    <input id="ConfirmDeleteMess" name="ConfirmDeleteMess" type="hidden" value="{ConfirmDeleteMess-val}" />
    <input id="ConfirmUpdateMess" name="ConfirmUpdateMess" type="hidden" value="{ConfirmUpdateMess-val}" />
    <input id="AddEmptyMessError" name="AddEmptyMessError" type="hidden" value="{AddEmptyMessError}"/>
    
</div>
