<script type="text/javascript">
    function SubmitSearchFormNew() {
        $("frmSearch").method = "get";
        $("frmSearch").action = "DomainControl.aspx";
        $("frmSearch").target = "";
        $("frmSearch").submit();
    }
</script>
<div class="padl0">
    <div id="errMsg" style="display: none;" class="styleErrAddbanner">
        <div id="error_item">
            <ul>
                <li><a class="err-msg" id="error_msg"></a></li>
            </ul>
        </div>
    </div>

<!--search form-->
<form id="frmSearch" name="frmSearch" method="get">
    <div id="search_cont">
        <table cellspacing="1" cellpadding="2">
            <tbody>
                <tr>
                    <td>{Market}</td>
                    <td>{slMarket}</td>
                    <td><div id="divsearch" onclick="SubmitSearchFormNew();">&nbsp;</div></td>
                </tr>
            </tbody>
        </table>
    </div>
</form>

<div class="divpageleft" style="display: inline-block;"><a class="abutton" href="javascript:AddDomainControl('{Market-value}');"><span id="Span1">{AddNew}</span></a></div>
<!--/search form-->
    <input type="hidden" id="X-CSRF-Token" name="X-CSRF-Token" value="{XsrfTokenFormValue}" />
<table class="aff-table" cellpadding="3" cellspacing="1" style="width: 900px;"> 
<!--header-->
<tr>
    <th style="width:10px">&nbsp;</th>
    <th>{Market}</th>
    <th>{AffDomain}</th>
    <th>{RedirectDomain}</th>
    <th>{Creator}</th>
    <th>{CreatedDate}</th>
    <th style="width:45px">{Status}</th>
    <th style="width:45px">{Edit}</th>
    <th style="width:45px">{Del}</th>
</tr>
<!--/header-->
<!--content-->
<tr bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
    <td class="c">{no}</td>
    <td class="l">{Market-val}</td>
    <td>{AffDomain-val}</td>
    <td>{RedirectDomain-val}</td>
    <td class="c">{Creator-val}</td>
    <td class="c">{CreatedDate-val}</td>
    <td class="c"><span class="chk {Status-val}">&nbsp;</span></td>
    <td class="c"><span class="icedit" onclick="DoCal('DomainControlUpd.aspx?id={ID-val}&affdomain={AffDomainId-val}&redirectdomain={RedirectDomainId-val}&market={MarketId-val}&status={Status-value}', 'Edit Domain Control', 450, 250);">&nbsp;</span></td>
    <td class="c"><span class="icdel" onclick="DomainControlDel('{ID-val}')">&nbsp;</span></td>
</tr>
<!--/content-->
</table>
<div class="divpageleft" style="display: inline-block;"><a class="abutton" href="javascript:AddDomainControl('{Market-value}');"><span id="Span2">{AddNew}</span></a></div>
</div>
