<div id="padl0">
    {submenu}
    <form id="frmSearch" name="frmSearch" method="get" style="margin: 7px 0;">
        <div id="search_cont">
            <table cellspacing="1" cellpadding="3" border="0">
                <tr>
                    <td class="r">
                        {aff-txt}
                    </td>
                    <td>
                        <input type="text" name="affname" id="affname" size="13" value="{affname}" class="txtdate-no-time" />
                    </td>
                    <td>
                        <select name="slPreferLang" id="slPreferLang">
                            <option value="">Select Language</option>
                            <option value="en-US">English</option>
                            <option value="en-GB">English_Euro</option>
                            <option value="zh-TW">Chinese Traditional</option>
                            <option value="zh-CN">Chinese Simplified</option>
                            <option value="th-TH">Thai</option>
                            <option value="es-ES">Spanish</option>
                            <option value="vi-VN">Vietnamese</option>
                            <option value="id-ID">Indonesian</option>
                            <option value="ko-KR">Korean</option>
                            <option value="ja-JP">Japanese</option>
                            <option value="hi-IN">Republic of India</option>
                        </select>
                    </td>
                    <td class="r">
                        {month-txt}
                    </td>
                    <td>
                        <input type="text" name="fmonth" size="13" value="{fmonth}" class="txtdate-no-time month-picker" id="fmonth" />&nbsp;
                        <img width="16" height="16" src="../{themepath}/images/cal.gif" class="img-date-selector hand"
                             style="margin-bottom: -3px;" title="Date selector" id="fmonth-Trigger" />
                    </td>
                    <td class="r">
                        {sortby-txt}
                    </td>
                    <td>
                        <select name="slSortBy" id="slSortBy">
                            <option value="0">Affiliate</option>
                            <option value="1">Sportsbook</option>
                            <option value="3">Casino</option>
                        </select>
                    </td>
                    <td style="width: 100px">
                        <span id="divsearch" onclick="Search();">&nbsp;</span>
                    </td>
                </tr>
            </table>
        </div>
        <input type="hidden" id="page" name="page" value="{page}" />
        <input type="submit" value="" class="hide" />
        <input type="hidden" id="hdLanguage" name="hdLanguage" value="{lang-val}" />
        <input type="hidden" id="hdSortBy" name="hdSortBy" value="{sortBy-val}" />
        <div id="divContent" class="ContentBox" style="width: 550px; overflow: visible;">
            {paging-top}
            <table class="aff-table" cellspacing="1" cellpadding="3" width="100%">
                <!--header-->
                <tr>
                    <th>&nbsp;</th>
                    <th style="width:100px;">{affiliate}</th>
                    <th>
                        {sportbook}
                    </th>
                    <th>
                        Casino
                    </th>
                    <!--<th>
                        {total}
                    </th>-->
                </tr>
                <!--/header-->
                <!--nodata-->
                <!--content-->
                <tr class="nowrap r" bgcolor="{color}" onmouseout="bgColor='{color}'" onmouseover="bgColor='{over}'">
                    <td>{num-val}</td>
                    <td class="l" style="width: 55px;">
                        <a href="AffiliateQMReportDetail.aspx?affid={affid-val}&affname={aff-val}&month={month-val}&year={year-val}">{aff-val}</a>
                    </td>
                    <td>
                        {sportbook-val}
                    </td>
                    <td>
                        {casino-val}
                    </td>
                    <!-- <td>
                         {total-val}
                     </td>-->
                </tr>
                <!--/content-->
                <!--/nodata-->
            </table>
            {paging-bottom}
        </div>
        <input type="hidden" id="hdCurrentYear" name="hcCurrentYear" value="{currentYear-val}" />
        <input type="hidden" id="hdCurrentMonth" name="hdCurrentMonth" value="{currentMonth-val}" />
    </form>
</div>
