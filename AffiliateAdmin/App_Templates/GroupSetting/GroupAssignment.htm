  <script language="javascript" type="text/javascript">
      var CheckboxStatus={CheckboxStatus_val};
      var isUsePrivateGroup={isUsePrivateGroup_val};
      var affList = '';
      window.onload = Initialize;
      function Initialize() {         
          listChk = parent.$$("div .chk");  
            var i = 0;
            if ($("chkPrivateGroup") != null && $("chkPrivateGroup") != 'undefined') {
                $("chkPrivateGroup").observe('click', PrivateGroupOnClick);    
            }

        }
        function PrivateGroupOnClick(event) {
            if (this.className == CheckboxStatus.OnEnable) {
                this.className = CheckboxStatus.OffEnable;
                $("slCommGroup").disabled='';
                isUsePrivateGroup=false;
            }
            else {
                this.className = CheckboxStatus.OnEnable;
                $("slCommGroup").disabled='disabled';
                isUsePrivateGroup=true;
            }
        }
       
       function f(){
            parent.ibcWnd.setRect( 150, 50, 585, 270);    
       }

        function ChangeGroup() {            
          
            if(!IsApproved){            
                if(isUsePrivateGroup && OldGroupID==parseInt(affList.substring(0,affList.length-1))){
                    alert("Please choose another group (not old group)!");
                    return;
                }               
                if(!isUsePrivateGroup &&  OldGroupID == parseInt($("slCommGroup").value)){
                    alert("Please choose another group (not old group)!");
                    return;
                }
            }
            
            if(isUsePrivateGroup){        
                var groupid;
                if(IsApproved){
                   groupid=parent.parent.fInfo.$("affID").innerHTML;                   
                   parent.ibcWnd.open("../GroupSetting/AddGroup.aspx?groupid=" + groupid + "&IsApproved=" + IsApproved + '&fname=' + encodeURIComponent(parent.parent.fInfo.$("hdFname").value) + '&username=' +  $('listAff').innerHTML + '&lang=' + encodeURIComponent(parent.parent.fInfo.$("hdPreferLang").value) + '&email=' + encodeURIComponent(parent.parent.fInfo.$("hdEmail").value), 'Approve affiliate ' + $('listAff').innerHTML  + ' with a private commission group', 150, 50, 755, 529, 'class1', 'class2');
                 }
                else{
                  groupid= parent.parent.fInfo.$("affID").innerHTML;
                  parent.ibcWnd.open("../GroupSetting/AddGroup.aspx?groupid=" + groupid , 'Change commission group for ' + $('listAff').innerHTML + ' (private group)' , 150, 50, 755, 529, 'class1', 'class2');
                  }                     
            }
            else{
                if(IsApproved){
                    var params = 'func=0&status=approved&fname=' + encodeURIComponent(parent.parent.fInfo.$("hdFname").value) + '&username=' + $('listAff').innerHTML + '&lang=' + encodeURIComponent(parent.parent.fInfo.$("hdPreferLang").value) + '&hdPreferredPayment=' + encodeURIComponent(parent.parent.fInfo.$("hdPreferredPayment").value) + '&hdPlayer_Username=' + encodeURIComponent(parent.parent.fInfo.$("hdPlayer_Username").value) + '&email=' + encodeURIComponent(parent.parent.fInfo.$("hdEmail").value) + '&groupid=' + $("slCommGroup").value + '&mailoption={mailoption}' +
                        "&X-CSRF-Token=" + $('X-CSRF-Token').value;
                    var ajax = new Ajax.Request("../Handler/UpdAffInfo.ashx?" , {
                    method: 'post',
                    parameters: params ,
                    onComplete: function(data) {
                        var arr = data.responseText.split("@");
                        alert(arr[1]);
                        parent.parent.location.href=parent.parent.location.href.replace(/#/, ""); 
                    }
                   });
                }
                else if (confirm('Are you sure you want to change the commission group for affiliate: \n' + $('listAff').innerHTML.replace(/<BR>/gi,"\n") + ' ?')) {
                         var ajax = new Ajax.Request("../Handler/CommGroupAssign.ashx", {
                         method: 'post',
                         parameters: "params=" + $("slCommGroup").value + "${affid}" + "&X-CSRF-Token=" + $('X-CSRF-Token').value,
                         onComplete: function(data) {
                             var result = data.responseText;
                             if (result != "") {
                               alert(result);
                             }
                             else {
                                 top.location.reload(); 
                             }
                        }
                     });
                 }
            }
        }
        var IsApproved={IsApproved_val};     
        var OldGroupID={OldGroupID_val};
        
  </script>
  <div class="container" style="width:550px;" >    
      <input type="hidden" id="X-CSRF-Token" name="X-CSRF-Token" value="{XsrfTokenFormValue}" /> 
     <div class="tab_content" style="border-width: 0 1px 0;">
    <!--ApproveAffiliate--><div class="form_row" style="margin: 0;"> Before you approve this affiliate, you must create or assign one commission group for him.</div><!--/ApproveAffiliate-->
     <div class="fieldset">
        <div class="legend">{Assignee}</div>
        <div class="clear"></div>
         <div class="form_row" id="listAff">{ListAff_val}</div>       
    </div>            
    <div class="fieldset">
        <div class="legend">{CommGroup}</div>
        <div class="clear"></div>
        <div class="form_row">
       {AssignCommGroup}:&nbsp;&nbsp;<select style="width:120px;" id="slCommGroup" name="slCommGroup" {slCommGroupDisabled_val}>
              <!--SelectOption--><option value="{option_value}" {selected_val}>{option_name}</option> <!--/SelectOption-->              
            </select>
         &nbsp;
         </div>
         <!--PrivateGroup-->
         <div class="form_row">
             Use private group:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <div id="chkPrivateGroup" class="{chkBoxClass_val}">&nbsp;</div>
         </div>         
         <!--/PrivateGroup-->
    </div>                
     
    <div class="btnSave" id="btnSave" onclick="ChangeGroup();" style="margin:10px 0;">{Save}</div>
  </div>   
</div>
